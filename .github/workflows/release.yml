name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag (vYYYY.MM.DD[.N])
        required: true
        type: string
    secrets:
      MINISIGN_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Check signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set. See KOCHREZEPT.md."; exit 1; fi
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
      - name: Install build dependencies
        run: make deps
      - name: Build
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          sudo -E make iso
      - name: Manifest + signature
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          export VERSION="${VERSION#v}"
          make manifest
      - name: Boot tests
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          sudo -E make test-boot
      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-logs-${{ env.TAG }}
          path: out/test/*.log
          if-no-files-found: ignore
      - name: Release notes
        run: |
          set -a; . out/release/release.env; set +a
          {
            echo "## $DIST_NAME $VERSION"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Debian | $SUITE (kernel from $KERNEL_SUITE) |"
            echo "| Kernel | $KERNEL |"
            echo "| Browser | $BROWSER $BROWSER_VERSION |"
            echo "| Built | $BUILD_DATE |"
            echo
            echo "**ISO**: write with \`dd\` to a USB stick or burn to DVD; boots on BIOS and UEFI (Secure Boot)."
            echo "Installed systems update themselves from this release automatically."
            echo
            echo '```'; cat out/release/SHA256SUMS; echo '```'
          } > out/release/NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out/release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file NOTES.md \
            ./*.iso filesystem.squashfs vmlinuz initrd.img manifest.json manifest.json.minisig SHA256SUMS release.env
