# Built-in defaults. Do not edit here; put overrides into kiosk.conf on the boot medium
# (ISO root / ESP root). See docs/CONFIG.md for all keys.
KIOSK_URL=
KIOSK_MODE=auto
KIOSK_LANG=de
KIOSK_KEYMAP=de
KIOSK_TIMEZONE=Europe/Berlin
KIOSK_HOSTNAME=kiosk
KIOSK_SCALE=1
KIOSK_INCOGNITO=0
KIOSK_FRESH_PROFILE=1
KIOSK_ALLOW_ZOOM=0
KIOSK_PRINTING=0
KIOSK_DOWNLOADS=0
KIOSK_AUTOPLAY=1
KIOSK_WAIT_NETWORK=20
KIOSK_UPDATE=1
KIOSK_UPDATE_REBOOT=1
KIOSK_DEBUG=0
