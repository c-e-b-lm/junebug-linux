# GRUB configuration for installed systems (written to the ESP by kiosk-install).
# Boots one of two slots (/live/a, /live/b) on the KIOSK_DATA partition and implements
# trial boots: after an update, the new slot gets exactly one try. If the running system
# does not confirm it (kiosk-mark-good), the next boot falls back to the previous slot.
set timeout=2
set gfxpayload=keep

search --no-floppy --label KIOSK_EFI --set=esp
search --no-floppy --label KIOSK_DATA --set=root
set envfile=($esp)/boot/grub/grubenv

set slot=a
set trial=0
set tried=0
if [ -s $envfile ]; then
    load_env -f $envfile slot trial tried
fi

if [ "$trial" = "1" ]; then
    if [ "$tried" = "1" ]; then
        # Trial slot booted once and was never confirmed: roll back.
        if [ "$slot" = "b" ]; then set slot=a; else set slot=b; fi
        set trial=0
        set tried=0
        save_env -f $envfile slot trial tried
    else
        set tried=1
        save_env -f $envfile tried
    fi
fi
if [ "$slot" = "b" ]; then set other=a; else set slot=a; set other=b; fi

set default=0
menuentry "@DIST_NAME@ (slot $slot)" {
    linux /live/$slot/vmlinuz live-media-path=/live/$slot kiosk.slot=$slot @CMDLINE@
    initrd /live/$slot/initrd.img
}
menuentry "@DIST_NAME@ (slot $other, previous version)" {
    linux /live/$other/vmlinuz live-media-path=/live/$other kiosk.slot=$other @CMDLINE@
    initrd /live/$other/initrd.img
}
menuentry "@DIST_NAME@ (slot $slot, safe graphics)" {
    linux /live/$slot/vmlinuz live-media-path=/live/$slot kiosk.slot=$slot nomodeset @CMDLINE@
    initrd /live/$slot/initrd.img
}
menuentry "@DIST_NAME@ (slot $slot, debug: serial console + shell on tty2)" {
    linux /live/$slot/vmlinuz live-media-path=/live/$slot kiosk.slot=$slot kiosk.debug=1 console=tty1 console=ttyS0,115200n8 @CMDLINE@
    initrd /live/$slot/initrd.img
}
