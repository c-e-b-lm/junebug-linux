# isolinux menu for the hybrid ISO (legacy BIOS path).
UI menu.c32
PROMPT 0
TIMEOUT 30
MENU TITLE @DIST_NAME@ @VERSION@

LABEL kiosk
  MENU LABEL @DIST_NAME@ @VERSION@
  MENU DEFAULT
  KERNEL /live/vmlinuz
  INITRD /live/initrd.img
  APPEND live-media-path=/live @CMDLINE@

LABEL toram
  MENU LABEL @DIST_NAME@ (copy to RAM, stick can be removed)
  KERNEL /live/vmlinuz
  INITRD /live/initrd.img
  APPEND live-media-path=/live toram @CMDLINE@

LABEL safe
  MENU LABEL @DIST_NAME@ (safe graphics)
  KERNEL /live/vmlinuz
  INITRD /live/initrd.img
  APPEND live-media-path=/live nomodeset @CMDLINE@

LABEL install
  MENU LABEL Install @DIST_NAME@ to disk
  KERNEL /live/vmlinuz
  INITRD /live/initrd.img
  APPEND live-media-path=/live kiosk.installer=1 @CMDLINE@

LABEL debug
  MENU LABEL @DIST_NAME@ (debug: serial console + shell on tty2)
  KERNEL /live/vmlinuz
  INITRD /live/initrd.img
  APPEND live-media-path=/live kiosk.debug=1 console=tty1 console=ttyS0,115200n8 @CMDLINE@
