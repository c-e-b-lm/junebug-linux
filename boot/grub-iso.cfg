# GRUB menu for the hybrid ISO (UEFI path: shim -> signed grub -> this file).
set default=0
set timeout=3
set gfxpayload=keep

menuentry "@DIST_NAME@ @VERSION@" {
    linux /live/vmlinuz live-media-path=/live @CMDLINE@
    initrd /live/initrd.img
}
menuentry "@DIST_NAME@ (copy to RAM, stick can be removed)" {
    linux /live/vmlinuz live-media-path=/live toram @CMDLINE@
    initrd /live/initrd.img
}
menuentry "@DIST_NAME@ (safe graphics)" {
    linux /live/vmlinuz live-media-path=/live nomodeset @CMDLINE@
    initrd /live/initrd.img
}
menuentry "Install @DIST_NAME@ to disk" {
    linux /live/vmlinuz live-media-path=/live kiosk.installer=1 @CMDLINE@
    initrd /live/initrd.img
}
menuentry "@DIST_NAME@ (debug: serial console + shell on tty2)" {
    linux /live/vmlinuz live-media-path=/live kiosk.debug=1 console=tty1 console=ttyS0,115200n8 @CMDLINE@
    initrd /live/initrd.img
}
