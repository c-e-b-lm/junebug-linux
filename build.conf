# Build configuration for Junebug Linux.
# Every value can be overridden from the environment, e.g. BROWSER=firefox make iso

DIST_NAME="${DIST_NAME:-Junebug Linux}"
DIST_ID="${DIST_ID:-junebug}"

# Debian release the image is based on.
SUITE="${SUITE:-trixie}"
# Where the kernel (and firmware) come from: trixie | trixie-backports | sid
KERNEL_SUITE="${KERNEL_SUITE:-trixie-backports}"
# Target platform: pc (x86-64 BIOS/UEFI ISO, default) | rpi (Raspberry Pi 3/4 SD card image, arm64).
PLATFORM="${PLATFORM:-pc}"
case "$PLATFORM" in
    rpi) ARCH="${ARCH:-arm64}" ;;
    *)   ARCH="${ARCH:-amd64}" ;;
esac

# Browser: chrome (Google Chrome stable, default) | firefox (Mozilla apt repo) | chromium (Debian)
BROWSER="${BROWSER:-chrome}"

# Ship nouveau GSP firmware for recent NVIDIA GPUs (adds ~40 MB). Display works without it (simpledrm).
FIRMWARE_NVIDIA="${FIRMWARE_NVIDIA:-0}"

MIRROR="${MIRROR:-http://deb.debian.org/debian}"
SECURITY_MIRROR="${SECURITY_MIRROR:-http://security.debian.org/debian-security}"

# zstd boots faster on weak CPUs, xz is ~10% smaller.
SQUASHFS_COMP="${SQUASHFS_COMP:-zstd}"

# Where installed systems look for updates (manifest.json + files).
UPDATE_URL="${UPDATE_URL:-https://github.com/kaeferfreund/junebug-linux/releases/latest/download}"
UPDATE_CHANNEL="${UPDATE_CHANNEL:-stable}"

ISO_LABEL="${ISO_LABEL:-KIOSK}"
