<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Junebug Linux logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a3a"/>
      <stop offset="1" stop-color="#0f1620"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a63b"/>
      <stop offset="1" stop-color="#c8651a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- browser window -->
  <rect x="16" y="16" width="224" height="224" rx="36" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="44" rx="36" fill="#2b3a4e"/>
  <rect x="16" y="40" width="224" height="20" fill="#2b3a4e"/>
  <circle cx="44" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="38" r="6" fill="#febc2e"/>
  <circle cx="84" cy="38" r="6" fill="#28c840"/>
  <rect x="104" y="30" width="116" height="16" rx="8" fill="#1a2533"/>

  <!-- beetle -->
  <g transform="translate(128 152)">
    <!-- legs -->
    <g stroke="#7a4b22" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M-34 -22 L-58 -40 M-58 -40 L-66 -56"/>
      <path d="M 34 -22 L 58 -40 M 58 -40 L 66 -56"/>
      <path d="M-40 2 L-66 4 M-66 4 L-78 -8"/>
      <path d="M 40 2 L 66 4 M 66 4 L 78 -8"/>
      <path d="M-34 26 L-56 46 M-56 46 L-66 62"/>
      <path d="M 34 26 L 56 46 M 56 46 L 66 62"/>
    </g>
    <!-- antennae (fan-shaped, Maikäfer) -->
    <g stroke="#7a4b22" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-14 -50 L-26 -70"/>
      <path d="M 14 -50 L 26 -70"/>
    </g>
    <g fill="#7a4b22">
      <path d="M-26 -70 l-14 -14 l6 -2 l12 10 z"/>
      <path d="M-26 -70 l-10 -18 l6 0 l8 14 z"/>
      <path d="M-26 -70 l-2 -20 l6 2 l0 16 z"/>
      <path d="M 26 -70 l14 -14 l-6 -2 l-12 10 z"/>
      <path d="M 26 -70 l10 -18 l-6 0 l-8 14 z"/>
      <path d="M 26 -70 l2 -20 l-6 2 l0 16 z"/>
    </g>
    <!-- head + thorax -->
    <circle cx="0" cy="-46" r="18" fill="#3d2612" stroke="#7a4b22" stroke-width="2"/>
    <circle cx="-7" cy="-50" r="4" fill="#ffffff"/>
    <circle cx="7" cy="-50" r="4" fill="#ffffff"/>
    <circle cx="-7" cy="-50" r="2" fill="#0f1620"/>
    <circle cx="7" cy="-50" r="2" fill="#0f1620"/>
    <ellipse cx="0" cy="-24" rx="30" ry="16" fill="#3d2612"/>
    <!-- elytra -->
    <path d="M-44 -12 C-48 30 -28 64 -4 66 L-4 -14 Z" fill="url(#shell)"/>
    <path d="M 44 -12 C 48 30 28 64 4 66 L 4 -14 Z" fill="url(#shell)"/>
    <path d="M-44 -12 C-48 30 -28 64 -4 66 L-4 -14 Z" fill="url(#shine)"/>
    <!-- wing texture -->
    <g stroke="#9a4a10" stroke-width="2.5" stroke-linecap="round" opacity=".55">
      <path d="M-30 -6 C-33 20 -24 44 -12 56"/>
      <path d="M-18 -8 C-20 20 -14 42 -8 58"/>
      <path d="M 30 -6 C 33 20 24 44 12 56"/>
      <path d="M 18 -8 C 20 20 14 42 8 58"/>
    </g>
    <!-- white side flecks (Maikäfer triangles) -->
    <g fill="#fff3e0" opacity=".9">
      <path d="M-44 -4 l6 10 l-6 2 z"/><path d="M-45 12 l6 10 l-6 2 z"/><path d="M-42 28 l6 10 l-6 2 z"/>
      <path d="M 44 -4 l-6 10 l6 2 z"/><path d="M 45 12 l-6 10 l6 2 z"/><path d="M 42 28 l-6 10 l6 2 z"/>
    </g>
  </g>
</svg>
