# Junebug Linux configuration.
# This file is read from the root of the boot medium: the ISO (baked in at build time),
# the KIOSK_EFI partition of an installed system (FAT32, editable from any PC), or a USB stick
# labelled KIOSKCFG. One KEY=value per line; values may be quoted. Full reference: docs/CONFIG.md

# --- Browser ---------------------------------------------------------------
# Start page. http(s)://..., or file:///... for an offline page.
KIOSK_URL=file:///usr/share/kiosk/welcome.html
# Browser UI language (Chrome --lang), e.g. de, en, fr
KIOSK_LANG=de
# Keyboard layout, XKB name with optional variant: de, us, ch:de_nodeadkeys, ...
KIOSK_KEYMAP=de
# UI scale factor for high-DPI screens (1, 1.5, 2)
KIOSK_SCALE=1
# 1 = wipe the browser profile every time the browser (re)starts
KIOSK_FRESH_PROFILE=1
# 1 = run in incognito / private mode
KIOSK_INCOGNITO=0
# 1 = allow pinch/ctrl+wheel zoom
KIOSK_ALLOW_ZOOM=0
# 1 = allow printing, 1 = allow downloads (both off for a locked-down kiosk)
KIOSK_PRINTING=0
KIOSK_DOWNLOADS=0
# 1 = allow camera/microphone for the start URL's origin without a prompt
KIOSK_MEDIA_CAPTURE=0
# 1 = media may autoplay with sound (digital signage)
KIOSK_AUTOPLAY=1
# Restrict navigation (space-separated Chrome URL patterns)
#KIOSK_URL_ALLOWLIST="example.org *.example.org"
#KIOSK_URL_BLOCKLIST="*"
# Extra browser command line flags
#KIOSK_BROWSER_ARGS="--force-dark-mode"

# --- System ----------------------------------------------------------------
KIOSK_HOSTNAME=kiosk
KIOSK_TIMEZONE=Europe/Berlin
#KIOSK_NTP_SERVER=pool.ntp.org
# Seconds to wait for the network before starting the browser (http/https URLs only)
KIOSK_WAIT_NETWORK=20

# --- Network ---------------------------------------------------------------
# Ethernet works automatically (DHCP). Wi-Fi:
#KIOSK_WIFI_SSID="MyNetwork"
#KIOSK_WIFI_PSK="secret"
# For static IPs or enterprise Wi-Fi drop NetworkManager keyfiles into a network/ directory next to this file.

# --- Updates (installed systems only) -------------------------------------
KIOSK_UPDATE=1
# 1 = reboot automatically after the nightly update (03:00-03:45)
KIOSK_UPDATE_REBOOT=1
#UPDATE_URL=https://github.com/kaeferfreund/junebug-linux/releases/latest/download

# --- Remote access / debugging --------------------------------------------
# SSH (root, key only). Separate several keys with ";"
#KIOSK_SSH_AUTHORIZED_KEYS="ssh-ed25519 AAAA... admin@example"
# Root password + login shell on tty2 (Ctrl+Alt+F2)
#KIOSK_ROOT_PASSWORD=changeme
# 1 = allow VT switching from the kiosk session and start a shell on tty2
KIOSK_DEBUG=0
